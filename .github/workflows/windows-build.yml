name: MasterRGB Windows Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Qt 6.8.3 for MSVC 2022 x64
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Build MasterRGB portable package
        shell: pwsh
        run: |
          if (-not $env:QT_ROOT_DIR) { throw 'Qt root was not exported by install-qt-action.' }
          $env:MASTER_RGB_QT_ROOT = $env:QT_ROOT_DIR
          .\scripts\Build-MasterRGB.ps1 -Workspace "$env:RUNNER_TEMP\MasterRGB-Build"

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe')
          )
          $isccPath = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $isccPath) { throw 'Inno Setup 6 (ISCC.exe) não está disponível no runner.' }
          & $isccPath .\installer\MasterRGB.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup falhou: $LASTEXITCODE" }

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          $header = '.\patches\source\qt\MasterRGBVersion.h'
          $match = [regex]::Match((Get-Content -Raw $header), '#define\s+MASTERRGB_VERSION\s+"([^"]+)"')
          if (-not $match.Success) { throw 'Versao nao encontrada em MasterRGBVersion.h' }
          $version = $match.Groups[1].Value
          $files = @(
            ".\dist\MasterRGB-$version-Portable.zip",
            ".\dist\MasterRGB-Setup-$version.exe"
          )
          foreach ($file in $files) { if (-not (Test-Path $file)) { throw "Artefato ausente: $file" } }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content '.\dist\SHA256SUMS.txt' -Encoding ASCII

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MasterRGB-Windows
          if-no-files-found: error
          path: |
            dist/MasterRGB-*-Portable.zip
            dist/MasterRGB-Setup-*.exe
            dist/SHA256SUMS.txt

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MasterRGB ${{ github.ref_name }}
          body_path: CHANGELOG.md
          prerelease: ${{ contains(github.ref_name, 'preview') }}
          draft: false
          files: |
            dist/MasterRGB-*-Portable.zip
            dist/MasterRGB-Setup-*.exe
            dist/SHA256SUMS.txt
